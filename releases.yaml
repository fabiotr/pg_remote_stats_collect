# Ordered oldest -> newest -- the single source of truth for this
# project's version. The last entry here is the current version; it
# should always match the latest tag on this project's git repo
# (public and/or Storyblok mirror) once that release is propagated
# there.
#
# deploy.py reads this file, never the other way around:
#   - a fresh deploy (no flags) stamps every release below into
#     stats_collect.schema_releases at once, deployed_at = now() --
#     01_remote_setup.sql..08_reports_ownership.sql already build the
#     schema at the latest release directly, so there's nothing to
#     migrate, only to record.
#   - `./deploy.py --migrate`, against an already-deployed environment,
#     runs each release's `migration` (relative to this file, under
#     migrations/) in order, for every release newer than the highest
#     version already recorded in schema_releases, then records it.
#     A release with `migration: null` (like the baseline below) is
#     just recorded -- there's nothing to run.
#
# Adding a new release: bump this file (new entry, migration: the new
# file under migrations/ implementing it), write that migration file,
# and update 01-08 in place to already reflect the new schema directly
# -- both must independently arrive at the same end state, one for
# fresh deploys, one for catching up an existing one.
releases:
  - version: "0.1.0"
    description: >-
      Baseline: FDW + dblink cross-instance stats collection
      (11 hist_* tables), 13 rpt_* historical/synthetic reporting
      views, config.yaml-driven deploy.py (fresh deploy, --update
      reconciler, --generate-calls).
    migration: null

  - version: "0.2.0"
    description: >-
      stat_collect_job now tracks one row per (job, instance) instead
      of one per job, with status/timing/errors independent per
      instance; it also gains a version column (each instance's
      server_version_num, fetched via dblink every run), replacing
      instance_config.pg_version.
    migration: migrations/0002_stat_collect_job_per_instance.sql

  - version: "0.2.1"
    description: >-
      Fix: 0002's migration now backfills stat_collect_job.version
      from instance_config.pg_version (parsed into server_version_num's
      encoding) before dropping that column, instead of leaving version
      NULL for every migrated row. Nothing to run here directly --
      already folded into 0002 itself, so any environment applying it
      from now on gets the fix automatically.
    migration: null

  - version: "0.3.0"
    description: >-
      Version-aware collection: setup_instance_fdw() now detects each
      instance's actual server_version_num and pg_stat_statements
      extversion via dblink and builds that instance's 7 foreign tables
      with only the columns its version tier actually has (minimum
      supported: PostgreSQL 10 / pg_stat_statements 1.6). collect_stats()
      copies matching columns by name into the now-superset
      hist_pg_stat_* tables (every column these views/pg_stat_statements
      have had across PostgreSQL 10-19), NULLing anything a given
      instance's version doesn't have -- this handles columns added AND
      removed over time. Based on a full column-history research pass
      covering PostgreSQL 8.4-19 and pg_stat_statements 1.0-1.13,
      floored at 10/1.6 for the actually-supported range.
    migration: migrations/0003_version_aware_columns.sql
